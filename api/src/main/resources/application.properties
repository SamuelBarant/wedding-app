spring.application.name=wedding-api

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wedding}
spring.datasource.username=${DB_USER:wedding}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# FILE UPLOAD
# ==========================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# ==========================================
# SERVER
# ==========================================

server.address=0.0.0.0
server.port=8080


# ==========================================
# STORAGE
# ==========================================

storage.photos-path=${PHOTO_STORAGE_PATH:./data/wedding}