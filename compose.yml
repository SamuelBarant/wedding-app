services:

  frontend:
    build:
      context: ./frontend
    container_name: wedding-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: ./api
    container_name: wedding-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env